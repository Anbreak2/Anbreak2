<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <!-- Background Dark Matrix Gradient -->
    <linearGradient id="matrixBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040806"/>
      <stop offset="50%" stop-color="#09120e"/>
      <stop offset="100%" stop-color="#020403"/>
    </linearGradient>

    <!-- Matrix Green Text & Stroke Gradient -->
    <linearGradient id="matrixGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00ffb7"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <linearGradient id="cardMatrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(8, 24, 16, 0.85)"/>
      <stop offset="100%" stop-color="rgba(4, 14, 9, 0.75)"/>
    </linearGradient>

    <!-- Matrix Neon Glow Filters -->
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="matrixGlowIntense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typewriter Clip Path for Title -->
    <clipPath id="typeClipMatrix">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width" from="0" to="540" dur="2.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Inter:wght@400;600;800&amp;display=swap');

    .bg { fill: url(#matrixBgGrad); }
    .font-mono { font-family: 'Fira Code', monospace; }
    .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    /* Matrix Digital Rain Column Animations */
    .matrix-code {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #00ff41;
      opacity: 0.15;
      writing-mode: tb;
      letter-spacing: 4px;
    }

    .rain-col-1 { animation: matrixFall 7s linear infinite; animation-delay: 0s; }
    .rain-col-2 { animation: matrixFall 9s linear infinite; animation-delay: 1.5s; fill: #00ffb7; opacity: 0.25; }
    .rain-col-3 { animation: matrixFall 6s linear infinite; animation-delay: 3s; }
    .rain-col-4 { animation: matrixFall 11s linear infinite; animation-delay: 0.8s; opacity: 0.2; }
    .rain-col-5 { animation: matrixFall 8s linear infinite; animation-delay: 2.2s; }
    .rain-col-6 { animation: matrixFall 10s linear infinite; animation-delay: 4.1s; fill: #38ef7d; }

    @keyframes matrixFall {
      0% { transform: translateY(-120px); opacity: 0; }
      20% { opacity: 0.35; }
      80% { opacity: 0.35; }
      100% { transform: translateY(360px); opacity: 0; }
    }

    /* Outer Border Glow */
    .matrix-border {
      fill: none;
      stroke: url(#matrixGreenGrad);
      stroke-width: 1.5;
      rx: 16;
      opacity: 0.7;
      animation: matrixPulse 4s ease-in-out infinite alternate;
    }
    @keyframes matrixPulse {
      0% { opacity: 0.5; filter: drop-shadow(0 0 3px rgba(0, 255, 65, 0.4)); }
      100% { opacity: 0.95; filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.8)); }
    }

    /* Glassmorphic Card */
    .glass-card {
      fill: url(#cardMatrixGrad);
      stroke: rgba(0, 255, 65, 0.25);
      stroke-width: 1;
      rx: 12;
    }

    /* Status Bar */
    .status-text {
      font-size: 12px;
      font-weight: 600;
      fill: #00ff41;
      letter-spacing: 1.5px;
    }

    /* Main Title */
    .title-main {
      font-size: 29px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .title-green {
      fill: url(#matrixGreenGrad);
    }

    .subtitle {
      font-size: 13.5px;
      fill: #a3b8cc;
      font-weight: 400;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.8s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Blinking Block Cursor */
    .cursor-matrix {
      fill: #00ff41;
      filter: url(#matrixGlow);
      animation: blinkMatrix 0.75s infinite;
    }
    @keyframes blinkMatrix {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Tech Stack Pills */
    .pill-bg {
      fill: rgba(6, 20, 13, 0.85);
      stroke: rgba(0, 255, 65, 0.3);
      stroke-width: 1;
      rx: 18;
    }
    .pill-text {
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .pill-icon { fill: #00ff41; }

    /* Animated Matrix Code Circle Graphic */
    .circle-outer {
      fill: none;
      stroke: url(#matrixGreenGrad);
      stroke-width: 2;
      animation: rotateMatrix 18s linear infinite;
      transform-origin: 700px 170px;
    }
    .circle-inner {
      fill: none;
      stroke: #00ff41;
      stroke-width: 1;
      stroke-dasharray: 4 6;
      animation: rotateMatrix 10s linear infinite reverse;
      transform-origin: 700px 170px;
      opacity: 0.6;
    }

    @keyframes rotateMatrix {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Pulsing Green Indicator Dot */
    .pulse-matrix-dot {
      fill: #00ff41;
      animation: pulseGreen 1.5s infinite alternate;
    }
    @keyframes pulseGreen {
      0% { filter: drop-shadow(0 0 2px #00ff41); opacity: 0.7; }
      100% { filter: drop-shadow(0 0 9px #00ff41); opacity: 1; }
    }
  </style>

  <!-- Dark Obsidian Matrix Background -->
  <rect width="850" height="340" rx="16" class="bg"/>

  <!-- Cascading Matrix Digital Rain Columns -->
  <g>
    <text x="40" y="0" class="matrix-code rain-col-1">01010110 101010 01100 10101 0101</text>
    <text x="120" y="0" class="matrix-code rain-col-2">FASTAPI DOCKER PYTHON RABBITMQ</text>
    <text x="210" y="0" class="matrix-code rain-col-3">11001010 010101 10110 01010 1100</text>
    <text x="310" y="0" class="matrix-code rain-col-4">MICROSERVICES ETL DEVOPS ARCH</text>
    <text x="430" y="0" class="matrix-code rain-col-5">01011010 101100 01010 11010 0101</text>
    <text x="540" y="0" class="matrix-code rain-col-2">SQL POSTGRES SPRING AWS DOCKER</text>
    <text x="630" y="0" class="matrix-code rain-col-6">10101100 010101 11001 01010 1010</text>
    <text x="760" y="0" class="matrix-code rain-col-3">BACKEND ARCHITECTURE PIPELINE</text>
  </g>

  <!-- Glassmorphic Central Card -->
  <rect x="35" y="35" width="780" height="270" class="glass-card"/>

  <!-- Status Bar Header -->
  <g transform="translate(65, 72)">
    <circle cx="0" cy="-4" r="4.5" class="pulse-matrix-dot"/>
    <text x="14" y="0" class="font-mono status-text">MATRIX ONLINE <tspan fill="#00ff41" opacity="0.4">//</tspan> USER: ANBREAK2 <tspan fill="#00ff41" opacity="0.4">//</tspan> BACKEND &amp; DEVOPS</text>
  </g>

  <!-- Animated Typewriter Header Text -->
  <g transform="translate(65, 125)">
    <g clip-path="url(#typeClipMatrix)">
      <text x="0" y="0" class="font-sans title-main">
        Hi, I'm <tspan class="title-green">André García</tspan> 👋
      </text>
    </g>
    <!-- Blinking Green Block Cursor -->
    <rect x="430" y="-25" width="10" height="30" class="cursor-matrix" rx="2">
      <animate attributeName="x" from="0" to="430" dur="2.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </g>

  <!-- Subtitle Description -->
  <text x="65" y="166" class="font-sans subtitle">
    Backend &amp; DevOps Engineer | Software Architecture, Distributed Pipelines &amp; Integrations
  </text>

  <!-- Tech Stack Pills -->
  <g transform="translate(65, 215)">
    <!-- Pill 1: Python & FastAPI -->
    <g transform="translate(0, 0)">
      <rect width="165" height="34" class="pill-bg"/>
      <text x="14" y="21" class="font-mono pill-text"><tspan class="pill-icon">🐍</tspan> Python &amp; FastAPI</text>
    </g>

    <!-- Pill 2: Docker & DevOps -->
    <g transform="translate(177, 0)">
      <rect width="160" height="34" class="pill-bg"/>
      <text x="14" y="21" class="font-mono pill-text"><tspan class="pill-icon">🐳</tspan> Docker &amp; DevOps</text>
    </g>

    <!-- Pill 3: RabbitMQ & ETL -->
    <g transform="translate(349, 0)">
      <rect width="155" height="34" class="pill-bg"/>
      <text x="14" y="21" class="font-mono pill-text"><tspan class="pill-icon">🐰</tspan> RabbitMQ &amp; ETL</text>
    </g>

    <!-- Pill 4: PostgreSQL & SQL -->
    <g transform="translate(516, 0)">
      <rect width="150" height="34" class="pill-bg"/>
      <text x="14" y="21" class="font-mono pill-text"><tspan class="pill-icon">🛢️</tspan> PostgreSQL &amp; SQL</text>
    </g>
  </g>

  <!-- Right Side Cyber / Matrix Node Graphic -->
  <g transform="translate(700, 170)">
    <!-- Outer Rotating Matrix Circle -->
    <circle cx="0" cy="0" r="54" class="circle-outer"/>
    <!-- Inner Dashed Counter-Rotating Circle -->
    <circle cx="0" cy="0" r="42" class="circle-inner"/>
    <!-- Glowing Center Disk & Icon -->
    <circle cx="0" cy="0" r="26" fill="rgba(0, 255, 65, 0.12)" filter="url(#matrixGlow)"/>
    <text x="0" y="6" text-anchor="middle" class="font-mono" font-size="18" font-weight="700" fill="#00ff41">&lt;/&gt;</text>
  </g>

  <!-- Floating Green Sparks -->
  <circle cx="100" cy="50" r="2" fill="#00ff41" filter="url(#matrixGlow)"/>
  <circle cx="490" cy="65" r="2.5" fill="#00ffb7" filter="url(#matrixGlow)"/>
  <circle cx="620" cy="105" r="2" fill="#00ff41"/>
  <circle cx="280" cy="290" r="2" fill="#38ef7d"/>
  <circle cx="780" cy="275" r="2.5" fill="#00ff41" filter="url(#matrixGlow)"/>

  <!-- Outer Neon Border Frame -->
  <rect x="2" y="2" width="846" height="336" class="matrix-border"/>
</svg>
