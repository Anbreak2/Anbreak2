<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <!-- Dark Matrix Background Gradient -->
    <linearGradient id="matrixBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010603"/>
      <stop offset="50%" stop-color="#041208"/>
      <stop offset="100%" stop-color="#010402"/>
    </linearGradient>

    <!-- Matrix Green Text & Glow Gradients -->
    <linearGradient id="matrixGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41"/>
      <stop offset="50%" stop-color="#33FF66"/>
      <stop offset="100%" stop-color="#00FF41"/>
    </linearGradient>

    <linearGradient id="cardMatrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(2, 20, 9, 0.94)"/>
      <stop offset="100%" stop-color="rgba(1, 10, 5, 0.88)"/>
    </linearGradient>

    <!-- Matrix Phosphor Glow Filters -->
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="matrixGlowIntense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- INFINITE MATRIX TYPEWRITER CLIP PATH FOR "Anbreak" -->
    <clipPath id="clipAnbreakLoop">
      <rect x="0" y="0" width="0" height="100">
        <animate 
          attributeName="width" 
          values="0; 340; 340; 0; 0" 
          keyTimes="0; 0.45; 0.85; 0.95; 1" 
          dur="4.5s" 
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style><![CDATA[
    .bg { fill: url(#matrixBgGrad); }
    .font-matrix { font-family: 'Consolas', 'Fira Code', 'Courier New', 'Courier', monospace; }

    /* Authentic Matrix Digital Rain Column Animations */
    .matrix-code {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #00FF41;
      opacity: 0.22;
      writing-mode: tb;
      letter-spacing: 5px;
      text-shadow: 0 0 6px #00FF41;
    }

    .rain-head { fill: #CCFFD8; font-weight: 800; text-shadow: 0 0 10px #00FF41; }

    .rain-col-1 { animation: matrixFall 6s linear infinite; animation-delay: 0s; }
    .rain-col-2 { animation: matrixFall 8s linear infinite; animation-delay: 1.2s; fill: #33FF66; opacity: 0.3; }
    .rain-col-3 { animation: matrixFall 5.5s linear infinite; animation-delay: 2.8s; }
    .rain-col-4 { animation: matrixFall 9.5s linear infinite; animation-delay: 0.5s; opacity: 0.25; }
    .rain-col-5 { animation: matrixFall 7.5s linear infinite; animation-delay: 2s; }
    .rain-col-6 { animation: matrixFall 8.5s linear infinite; animation-delay: 3.8s; fill: #00FF41; }

    @keyframes matrixFall {
      0% { transform: translateY(-130px); opacity: 0; }
      15% { opacity: 0.45; }
      85% { opacity: 0.45; }
      100% { transform: translateY(370px); opacity: 0; }
    }

    /* Outer Border Glow */
    .matrix-border {
      fill: none;
      stroke: #00FF41;
      stroke-width: 1.5;
      rx: 16;
      opacity: 0.75;
      animation: matrixBorderGlow 3s ease-in-out infinite alternate;
    }

    .card-border {
      fill: none;
      stroke: #00FF41;
      stroke-width: 1.2;
      rx: 14;
      opacity: 0.4;
      animation: cardPulse 4s ease-in-out infinite alternate;
    }

    @keyframes matrixBorderGlow {
      0% { opacity: 0.5; filter: drop-shadow(0 0 4px #00FF41); }
      100% { opacity: 0.95; filter: drop-shadow(0 0 12px #00FF41); }
    }

    @keyframes cardPulse {
      0% { opacity: 0.3; stroke: #008F11; }
      100% { opacity: 0.6; stroke: #00FF41; }
    }

    /* Glassmorphic Cards */
    .glass-card {
      fill: url(#cardMatrixGrad);
      stroke: rgba(0, 255, 65, 0.35);
      stroke-width: 1;
      rx: 14;
    }

    /* Header Text */
    .card-header-text {
      font-size: 11px;
      font-weight: 700;
      fill: #00FF41;
      letter-spacing: 1.5px;
      text-shadow: 0 0 5px #00FF41;
    }

    /* Left Card: Big Matrix Generated "Anbreak" */
    .anbreak-title-large {
      font-size: 52px;
      font-weight: 800;
      fill: url(#matrixGreenGrad);
      letter-spacing: 5px;
      filter: drop-shadow(0 0 8px #00FF41) drop-shadow(0 0 16px rgba(0, 255, 65, 0.5));
    }

    /* Continuous Matrix Character Glitch & Regenerating Cipher */
    .char-matrix {
      animation: matrixRegenFlicker 1.5s ease-in-out infinite alternate;
    }
    .c-1 { animation-delay: 0.05s; }
    .c-2 { animation-delay: 0.2s; }
    .c-3 { animation-delay: 0.35s; }
    .c-4 { animation-delay: 0.5s; }
    .c-5 { animation-delay: 0.65s; }
    .c-6 { animation-delay: 0.8s; }
    .c-7 { animation-delay: 0.95s; }

    @keyframes matrixRegenFlicker {
      0% { opacity: 1; fill: #00FF41; filter: drop-shadow(0 0 4px #00FF41); }
      50% { opacity: 0.75; fill: #CCFFD8; filter: drop-shadow(0 0 12px #00FF41); }
      100% { opacity: 1; fill: #00FF41; filter: drop-shadow(0 0 6px #00FF41); }
    }

    /* Right Card Matrix Terminal Rows */
    .term-label {
      font-size: 11px;
      font-weight: 700;
      fill: #00FF41;
      letter-spacing: 0.5px;
      text-shadow: 0 0 4px rgba(0, 255, 65, 0.6);
    }

    .term-val {
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }

    .term-val-highlight {
      font-size: 12px;
      font-weight: 700;
      fill: #00FF41;
      text-shadow: 0 0 6px #00FF41;
    }

    /* Blinking Block Cursor */
    .cursor-matrix {
      fill: #00FF41;
      filter: url(#matrixGlowIntense);
      animation: blinkMatrix 0.6s infinite;
    }
    @keyframes blinkMatrix {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    /* Pulsing Green Indicator Dot */
    .pulse-matrix-dot {
      fill: #00FF41;
      animation: pulseGreen 1.2s infinite alternate;
    }
    @keyframes pulseGreen {
      0% { filter: drop-shadow(0 0 2px #00FF41); opacity: 0.6; fill: #00FF41; }
      100% { filter: drop-shadow(0 0 10px #00FF41); opacity: 1; fill: #CCFFD8; }
    }
  ]]></style>

  <!-- Dark Obsidian Matrix Background -->
  <rect width="850" height="340" rx="16" class="bg"/>

  <!-- Cascading Pure Matrix Digital Rain Columns -->
  <g>
    <text x="30" y="0" class="matrix-code rain-col-1"><tspan class="rain-head">1</tspan>01010110 ANBREAK 01100 10101 0101</text>
    <text x="110" y="0" class="matrix-code rain-col-2"><tspan class="rain-head">0</tspan>FASTAPI DOCKER PYTHON RABBITMQ</text>
    <text x="220" y="0" class="matrix-code rain-col-3"><tspan class="rain-head">1</tspan>11001010 010101 10110 01010 1100</text>
    <text x="330" y="0" class="matrix-code rain-col-4"><tspan class="rain-head">0</tspan>MICROSERVICES ETL DEVOPS ARCH</text>
    <text x="440" y="0" class="matrix-code rain-col-5"><tspan class="rain-head">1</tspan>01011010 ANBREAK 01010 11010 0101</text>
    <text x="550" y="0" class="matrix-code rain-col-2"><tspan class="rain-head">0</tspan>SQL POSTGRES SPRING AWS DOCKER</text>
    <text x="660" y="0" class="matrix-code rain-col-6"><tspan class="rain-head">1</tspan>10101100 010101 11001 01010 1010</text>
    <text x="770" y="0" class="matrix-code rain-col-3"><tspan class="rain-head">0</tspan>BACKEND ARCHITECTURE PIPELINE</text>
  </g>

  <!-- ================= LEFT CARD: INFINITE REGENERATING MATRIX "Anbreak" ================= -->
  <g transform="translate(30, 30)">
    <!-- Glassmorphic Container -->
    <rect width="380" height="280" class="glass-card"/>
    <rect width="380" height="280" class="card-border"/>

    <!-- Top Card Bar -->
    <g transform="translate(20, 32)">
      <circle cx="0" cy="-4" r="4" class="pulse-matrix-dot"/>
      <text x="12" y="0" class="font-matrix card-header-text">IDENTITY_NODE <tspan fill="#00FF41" opacity="0.4">//</tspan> MATRIX CORE</text>
    </g>

    <!-- INFINITE MATRIX REGENERATING TEXT "Anbreak" -->
    <g transform="translate(20, 100)">
      <!-- Matrix Clipped Digital Typing & Infinite Loop -->
      <g clip-path="url(#clipAnbreakLoop)">
        <text x="5" y="55" class="font-matrix anbreak-title-large">
          <tspan class="char-matrix c-1">A</tspan><tspan class="char-matrix c-2">n</tspan><tspan class="char-matrix c-3">b</tspan><tspan class="char-matrix c-4">r</tspan><tspan class="char-matrix c-5">e</tspan><tspan class="char-matrix c-6">a</tspan><tspan class="char-matrix c-7">k</tspan>
        </text>
      </g>

      <!-- Matrix Infinite Cursor Loop -->
      <rect y="10" width="9" height="48" class="cursor-matrix" rx="2">
        <animate 
          attributeName="x" 
          values="5; 298; 298; 5; 5" 
          keyTimes="0; 0.45; 0.85; 0.95; 1" 
          dur="4.5s" 
          repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Matrix Scanline Beam Accent with Continuous Loop -->
    <line x1="20" y1="175" x2="360" y2="175" stroke="#00FF41" stroke-width="1" stroke-dasharray="6 4" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1s" repeatCount="indefinite"/>
    </line>

    <!-- Subtitle Stack Pill -->
    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="340" height="34" fill="rgba(0, 255, 65, 0.08)" stroke="rgba(0, 255, 65, 0.35)" stroke-width="1" rx="8"/>
      <text x="16" y="22" class="font-matrix" font-size="12" font-weight="700" fill="#00FF41">⚡ BACKEND &amp; DEVOPS ARCHITECT</text>
    </g>
  </g>

  <!-- ================= RIGHT CARD: MATRIX STATUS & USER INTEL ================= -->
  <g transform="translate(440, 30)">
    <!-- Glassmorphic Container -->
    <rect width="380" height="280" class="glass-card"/>
    <rect width="380" height="280" class="card-border"/>

    <!-- Top Card Bar -->
    <g transform="translate(20, 32)">
      <circle cx="0" cy="-4" r="4" class="pulse-matrix-dot"/>
      <text x="12" y="0" class="font-matrix card-header-text">SYSTEM_STATUS <tspan fill="#00FF41" opacity="0.4">//</tspan> USER INTEL</text>
    </g>

    <!-- Terminal Content Lines -->
    <g transform="translate(20, 75)">
      <!-- Row 1: Username -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="font-matrix term-label">USER_HANDLE :</text>
        <text x="110" y="0" class="font-matrix term-val-highlight">@Anbreak2</text>
      </g>

      <!-- Row 2: Role -->
      <g transform="translate(0, 30)">
        <text x="0" y="0" class="font-matrix term-label">SYS_ROLE    :</text>
        <text x="110" y="0" class="font-matrix term-val">Backend &amp; DevOps Engineer</text>
      </g>

      <!-- Row 3: Location -->
      <g transform="translate(0, 60)">
        <text x="0" y="0" class="font-matrix term-label">LOCATION    :</text>
        <text x="110" y="0" class="font-matrix term-val">Zapopan, Jal. (Global Remote)</text>
      </g>

      <!-- Row 4: Core Stack -->
      <g transform="translate(0, 90)">
        <text x="0" y="0" class="font-matrix term-label">CORE_STACK  :</text>
        <text x="110" y="0" class="font-matrix term-val">Python • FastAPI • Docker • RabbitMQ</text>
      </g>

      <!-- Row 5: Current Mission -->
      <g transform="translate(0, 120)">
        <text x="0" y="0" class="font-matrix term-label">MISSION     :</text>
        <text x="110" y="0" class="font-matrix term-val">Async ETL Pipelines (CISZ Zapopan)</text>
      </g>

      <!-- Row 6: Status Pill -->
      <g transform="translate(0, 155)">
        <rect x="0" y="-14" width="336" height="30" fill="rgba(0, 255, 65, 0.08)" stroke="rgba(0, 255, 65, 0.35)" stroke-width="1" rx="6"/>
        <circle cx="14" cy="1" r="3.5" class="pulse-matrix-dot"/>
        <text x="26" y="5" class="font-matrix" font-size="11" font-weight="700" fill="#00FF41">STATUS: ONLINE // AVAILABLE FOR PROJECTS</text>
      </g>
    </g>
  </g>

  <!-- Outer Neon Border Frame -->
  <rect x="2" y="2" width="846" height="336" class="matrix-border"/>
</svg>
